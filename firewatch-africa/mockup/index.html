/* ==========================================================================
   FireWatch Africa — styles de la maquette (consomment uniquement tokens.css)

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fw-color-bg-sunken); }
body { font-family: var(--fw-font-family-sans); font-size: var(--fw-font-size-md); line-height: var(--fw-font-line-height-normal); color: var(--fw-color-text-primary); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }

:focus-visible { outline: 2px solid var(--fw-color-border-focus); outline-offset: 2px; border-radius: var(--fw-radius-xs); }
.mono, .num { font-family: var(--fw-font-family-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

[data-reduce-motion="true"] *, [data-reduce-motion="true"] *::before, [data-reduce-motion="true"] *::after { animation-duration: 0ms !important; transition-duration: 0ms !important; }

/* ---------- Cadre d'aperçu (outil maquette) ---------- */
.fw-stage { height: 100%; display: flex; flex-direction: column; }
.fw-stage__bar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: #05080C; border-bottom: 1px solid var(--fw-color-border-subtle); font-size: 12px; color: var(--fw-color-text-muted); flex-wrap: wrap; }

.fw-stage__bar select, .fw-stage__bar button { background: var(--fw-color-bg-surface2); border: 1px solid var(--fw-color-border-default); border-radius: var(--fw-radius-sm); padding: 3px 8px; font-size: 12px; cursor: pointer; }
.fw-stage__bar button[aria-pressed="true"] { background: var(--fw-color-nasa-bg); border-color: var(--fw-color-nasa-500); color: var(--fw-color-nasa-300); }
.fw-stage__bar .seg { display: inline-flex; gap: 2px; }

.fw-stage__viewport { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: auto; padding: 0; }
.fw-stage[data-frame="tablet"] .fw-stage__viewport, .fw-stage[data-frame="mobile"] .fw-stage__viewport { padding: 16px; background: radial-gradient(circle at 50% 0, #0d141c, #04070a); }
.fw-stage[data-frame="tablet"] .fw-frame { width: 770px; flex-shrink: 0; height: min(1024px, 100%); border: 1px solid var(--fw-color-border-default); border-radius: 18px; }

/* ---------- AppShell ---------- */
.fw-frame { container: app / inline-size; position: relative; width: 100%; height: 100%; overflow: hidden; }
.fw-stage[data-frame="tablet"] .fw-app, .fw-stage[data-frame="mobile"] .fw-app { border-radius: inherit; }
.fw-app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--fw-color-bg-base); display: grid; grid-template-columns: var(--fw-size-sidebar) 1fr; grid-template-rows: var(--fw-size-topbar) auto 1fr; grid-template-areas: "side top" "side banner" "side main"; }

.fw-main:focus { outline: none; }
.fw-banners { grid-area: banner; }
.fw-page { padding: var(--fw-space-6); max-width: var(--fw-size-content-max); margin: 0 auto; animation: fw-fade-up var(--fw-motion-duration-slow) var(--fw-motion-easing-standard) both; }

.fw-nav__item { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--fw-radius-sm); color: var(--fw-color-text-secondary); text-decoration: none; font-weight: 500; position: relative; transition: background var(--fw-motion-duration-fast), color var(--fw-motion-duration-fast); min-height: 38px; }

/* ---------- Topbar ---------- */
.fw-topbar { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 0 var(--fw-space-5); border-bottom: 1px solid var(--fw-color-border-subtle); background: rgba(10,15,21,.86); backdrop-filter: blur(10px); z-index: var(--fw-z-sticky); min-width: 0; }

.fw-dot--err { background: var(--fw-color-feedback-danger); box-shadow: 0 0 0 3px rgba(240,88,93,.15); }

/* ---------- Boutons, champs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--fw-size-control-height); padding: 0 14px; border-radius: var(--fw-radius-sm); border: 1px solid var(--fw-color-border-default); background: var(--fw-color-bg-surface2); color: var(--fw-color-text-primary); font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background var(--fw-motion-duration-fast), border-color var(--fw-motion-duration-fast), transform var(--fw-motion-duration-instant); }
.btn:hover { background: var(--fw-color-bg-surface3); border-color: var(--fw-color-border-strong); }
.btn:active { transform: translateY(1px); }

.select { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fw-color-text-muted) 50%), linear-gradient(135deg, var(--fw-color-text-muted) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }

.switch input:focus-visible + span { outline: 2px solid var(--fw-color-border-focus); outline-offset: 2px; }

/* ---------- Cartes / panneaux ---------- */
.card { background: var(--fw-color-bg-surface1); border: 1px solid var(--fw-color-border-subtle); border-radius: var(--fw-radius-md); box-shadow: var(--fw-shadow-1); min-width: 0; }
.card__head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; flex-wrap: wrap; }
.card__title { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.005em; }
.card__sub { font-size: 12px; color: var(--fw-color-text-muted); }
.card__actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.card__body { padding: 14px 16px 16px; }
.card__foot { padding: 10px 16px; border-top: 1px solid var(--fw-color-border-subtle); font-size: 12px; color: var(--fw-color-text-muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.overline { font-size: var(--fw-font-size-2xs); letter-spacing: var(--fw-font-letter-spacing-overline); text-transform: uppercase; color: var(--fw-color-text-muted); font-weight: 600; }
.grid { display: grid; gap: var(--fw-space-4); }
.g-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-9 { grid-column: span 9; } .span-12 { grid-column: span 12; }
.stack { display: flex; flex-direction: column; gap: var(--fw-space-4); }
.row { display: flex; align-items: center; gap: var(--fw-space-3); flex-wrap: wrap; }
.muted { color: var(--fw-color-text-muted); } .secondary { color: var(--fw-color-text-secondary); }
.small { font-size: 12px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: var(--fw-space-5); flex-wrap: wrap; }
.page-head h2 { font-size: var(--fw-font-size-3xl); margin: 4px 0 0; letter-spacing: var(--fw-font-letter-spacing-tight); line-height: 1.15; font-weight: 650; }
.page-head p { margin: 6px 0 0; color: var(--fw-color-text-secondary); max-width: 760px; }
.page-head__actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Hero dashboard ---------- */
.hero { position: relative; overflow: hidden; border-radius: var(--fw-radius-lg); border: 1px solid var(--fw-color-border-subtle); background: radial-gradient(120% 140% at 85% 10%, rgba(242,140,40,.14), transparent 45%), radial-gradient(90% 120% at 0% 100%, rgba(47,143,98,.18), transparent 55%), linear-gradient(135deg, #0F1821, #0B1118); padding: 26px 28px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; margin-bottom: var(--fw-space-4); }
[data-theme="light"] .hero { background: radial-gradient(120% 140% at 85% 10%, rgba(242,140,40,.12), transparent 45%), radial-gradient(90% 120% at 0% 100%, rgba(47,143,98,.12), transparent 55%), var(--fw-color-bg-surface1); }
.hero h2 { font-size: 30px; line-height: 1.12; margin: 8px 0 10px; letter-spacing: -0.025em; font-weight: 650; max-width: 560px; }
.hero h2 em { font-style: normal; color: var(--fw-color-thermal-300); }
[data-theme="light"] .hero h2 em { color: var(--fw-color-thermal-500); }
.hero p { color: var(--fw-color-text-secondary); margin: 0 0 18px; max-width: 560px; }
.hero__orbit { position: absolute; right: -60px; top: -80px; width: 380px; height: 380px; border-radius: 50%; border: 1px dashed rgba(76,201,240,.16); pointer-events: none; }
.hero__orbit::after { content: ""; position: absolute; inset: 50px; border-radius: 50%; border: 1px solid rgba(76,201,240,.08); }
.hero__meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: center; position: relative; }
.hero__meta .tile { background: rgba(7,11,16,.55); border: 1px solid var(--fw-color-border-subtle); border-radius: var(--fw-radius-md); padding: 12px 14px; }
[data-theme="light"] .hero__meta .tile { background: var(--fw-color-bg-surface2); }
.hero__meta .tile b { display: block; font-family: var(--fw-font-family-mono); font-size: 15px; font-weight: 500; margin-top: 4px; }

/* ---------- StatCard ---------- */
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--fw-space-3); margin-bottom: var(--fw-space-4); }
.stat { padding: 14px 16px; position: relative; overflow: hidden; animation: fw-fade-up var(--fw-motion-duration-slow) var(--fw-motion-easing-standard) both; }
.stat:nth-child(2) { animation-delay: 40ms; } .stat:nth-child(3) { animation-delay: 80ms; } .stat:nth-child(4) { animation-delay: 120ms; } .stat:nth-child(5) { animation-delay: 160ms; } .stat:nth-child(6) { animation-delay: 200ms; }
.stat__label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fw-color-text-secondary); font-weight: 500; }
.stat__label .sym { width: 10px; height: 10px; flex-shrink: 0; }
.stat__value { font-family: var(--fw-font-family-sans); font-size: 28px; font-weight: 600; letter-spacing: -0.025em; margin-top: 8px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat__value small { font-size: 13px; color: var(--fw-color-text-muted); margin-left: 4px; letter-spacing: 0; }
.stat__foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--fw-color-text-muted); min-height: 18px; }
.delta { font-family: var(--fw-font-family-mono); font-size: 12px; display: inline-flex; align-items: center; gap: 3px; color: var(--fw-color-text-secondary); }
.stat__row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.stat__spark { opacity: .9; margin-bottom: 4px; flex-shrink: 0; }
.stat--accent { border-color: rgba(242,140,40,.35); background: linear-gradient(180deg, rgba(242,140,40,.08), transparent 70%), var(--fw-color-bg-surface1); }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--fw-color-border-default); color: var(--fw-color-text-secondary); white-space: nowrap; background: var(--fw-color-bg-surface2); }
.badge svg { width: 10px; height: 10px; }
.badge--modis { color: var(--fw-color-text-primary); border-color: color-mix(in srgb, var(--fw-color-sensor-modis) 60%, transparent); }
.badge--viirs { color: var(--fw-color-text-primary); border-color: color-mix(in srgb, var(--fw-color-sensor-viirs) 60%, transparent); }
.badge--fused { color: var(--fw-color-text-primary); border-color: color-mix(in srgb, var(--fw-color-sensor-fused) 60%, transparent); }
.badge--nasa { color: var(--fw-color-nasa-300); border-color: rgba(76,201,240,.35); background: var(--fw-color-nasa-bg); }
.badge--demo { color: var(--fw-color-thermal-300); border-color: rgba(242,140,40,.4); background: rgba(242,140,40,.08); letter-spacing: .06em; }
[data-theme="light"] .badge--demo { color: var(--fw-color-thermal-500); }
.badge--exp { color: var(--fw-color-feedback-warning); border-color: rgba(242,181,58,.45); background: rgba(242,181,58,.08); }
.lvl { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.lvl__ico { font-size: 11px; line-height: 1; }
.lvl--low { color: var(--fw-color-level-low); } .lvl--moderate { color: var(--fw-color-level-moderate); } .lvl--high { color: var(--fw-color-level-high); }
.lvl.pill { padding: 3px 9px; border-radius: 99px; border: 1px solid currentColor; background: color-mix(in srgb, currentColor 10%, transparent); }
.conf { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fw-color-text-secondary); white-space: nowrap; }
.conf__bars { display: inline-flex; gap: 2px; align-items: flex-end; }
.conf__bars i { width: 4px; border-radius: 1px; background: var(--fw-color-border-strong); }
.conf__bars i:nth-child(1) { height: 6px; } .conf__bars i:nth-child(2) { height: 9px; } .conf__bars i:nth-child(3) { height: 12px; }
.conf--low .conf__bars i:nth-child(1), .conf--nominal .conf__bars i:nth-child(-n+2), .conf--high .conf__bars i { background: var(--fw-color-text-primary); }

/* ---------- Score d'harmonisation ---------- */
.hscore { display: inline-flex; align-items: center; gap: 10px; }
.hscore__ring { position: relative; width: 44px; height: 44px; }
.hscore__ring svg { transform: rotate(-90deg); }
.hscore__ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--fw-font-family-mono); font-size: 12.5px; font-weight: 500; }
.hscore--lg .hscore__ring { width: 96px; height: 96px; } .hscore--lg .hscore__ring b { font-size: 22px; }
.hbar { height: 6px; border-radius: 3px; background: var(--fw-color-bg-surface3); overflow: hidden; }
.hbar > i { display: block; height: 100%; border-radius: 3px; background: var(--fw-color-sensor-fused); transition: width var(--fw-motion-duration-slow) var(--fw-motion-easing-standard); }

/* ---------- Tableaux ---------- */
.table-wrap { overflow: auto; border-radius: var(--fw-radius-sm); border: 1px solid var(--fw-color-border-subtle); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--fw-color-text-secondary); background: var(--fw-color-bg-surface2); padding: 9px 12px; border-bottom: 1px solid var(--fw-color-border-default); white-space: nowrap; position: sticky; top: 0; z-index: 1; letter-spacing: .02em; }
.table th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.table th button:focus-visible { outline: 2px solid var(--fw-color-border-focus); }
.table td { padding: 9px 12px; border-bottom: 1px solid var(--fw-color-border-subtle); white-space: nowrap; }
.table tbody tr { transition: background var(--fw-motion-duration-fast); }
.table tbody tr:hover { background: var(--fw-color-bg-surface2); }
.table tbody tr.is-link { cursor: pointer; }
.table td.r, .table th.r { text-align: right; }
.table .num { font-size: 12.5px; }

/* ---------- Bannières / états ---------- */
.banner { display: flex; align-items: center; gap: 12px; padding: 9px var(--fw-space-5); font-size: 13px; border-bottom: 1px solid var(--fw-color-border-subtle); }
.banner svg { width: 16px; height: 16px; flex-shrink: 0; }
.banner--warn { background: rgba(242,181,58,.08); color: var(--fw-color-text-primary); } .banner--warn svg { color: var(--fw-color-feedback-warning); }
.banner--offline { background: rgba(157,172,189,.08); } .banner--offline svg { color: var(--fw-color-text-secondary); }
.banner--info { background: var(--fw-color-nasa-bg); } .banner--info svg { color: var(--fw-color-nasa-500); }
.banner--err { background: var(--fw-color-high-bg); } .banner--err svg { color: var(--fw-color-feedback-danger); }
.banner .btn { margin-left: auto; }
.notice { display: flex; gap: 12px; padding: 12px 14px; border-radius: var(--fw-radius-md); border: 1px solid; font-size: 13px; line-height: 1.5; }
.notice svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
.notice--sci { border-color: rgba(76,201,240,.3); background: var(--fw-color-nasa-bg); } .notice--sci svg { color: var(--fw-color-nasa-500); }
.notice--exp { border-color: rgba(242,181,58,.35); background: rgba(242,181,58,.07); } .notice--exp svg { color: var(--fw-color-feedback-warning); }
.notice strong { display: block; margin-bottom: 2px; }
.state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; gap: 10px; min-height: 220px; animation: fw-fade-up var(--fw-motion-duration-slow) var(--fw-motion-easing-standard) both; }
.state__ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--fw-color-bg-surface2); border: 1px solid var(--fw-color-border-default); margin-bottom: 4px; }
.state__ico svg { width: 24px; height: 24px; }
.state h3 { margin: 0; font-size: 16px; font-weight: 600; }
.state p { margin: 0; color: var(--fw-color-text-secondary); max-width: 440px; font-size: 13.5px; }
.state code { font-family: var(--fw-font-family-mono); font-size: 11.5px; color: var(--fw-color-text-muted); background: var(--fw-color-bg-surface2); padding: 3px 7px; border-radius: 4px; }
.state--error .state__ico { color: var(--fw-color-feedback-danger); border-color: rgba(240,88,93,.35); }
.state--empty .state__ico { color: var(--fw-color-text-secondary); }
.state--offline .state__ico { color: var(--fw-color-text-secondary); }
.state--filter .state__ico { color: var(--fw-color-nasa-500); }
.skel { position: relative; overflow: hidden; background: var(--fw-color-bg-surface2); border-radius: var(--fw-radius-sm); }
.skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(157,172,189,.08), transparent); animation: fw-shimmer 1.4s infinite; }
.loading-line { height: 2px; position: relative; overflow: hidden; background: transparent; }
.loading-line::after { content: ""; position: absolute; left: -40%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, var(--fw-color-nasa-500), transparent); animation: fw-scan 1.2s infinite var(--fw-motion-easing-standard); }

/* ---------- Carte ---------- */
.map { position: relative; width: 100%; height: 100%; min-height: 260px; background: var(--fw-color-map-ocean); overflow: hidden; border-radius: inherit; touch-action: none; user-select: none; }
.map svg.map__svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.map svg.map__svg.is-dragging { cursor: grabbing; }
.map__land { fill: var(--fw-color-map-land); stroke: var(--fw-color-map-land-stroke); stroke-width: .8; vector-effect: non-scaling-stroke; }
.map__land--focus { fill: var(--fw-color-map-focus-land); }
.map__water { fill: var(--fw-color-map-ocean); stroke: var(--fw-color-map-land-stroke); stroke-width: .6; vector-effect: non-scaling-stroke; }
.map__grat { stroke: var(--fw-color-map-graticule); stroke-width: 1; fill: none; vector-effect: non-scaling-stroke; }
.map__gabon { fill: rgba(47,143,98,.10); stroke: var(--fw-color-forest-300); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.map__prov { fill: transparent; stroke: var(--fw-color-map-admin); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; transition: fill var(--fw-motion-duration-fast); }
.map__prov.is-choro { stroke-dasharray: none; stroke: var(--fw-color-bg-base); stroke-width: 1.5; }
.map__prov:hover { fill: rgba(76,201,240,.06); }
.map__label { fill: var(--fw-color-text-muted); font-family: var(--fw-font-family-sans); paint-order: stroke; stroke: var(--fw-color-map-ocean); stroke-width: 3px; pointer-events: none; }
.map__label--city { fill: var(--fw-color-text-secondary); }
.map__hot { fill: rgba(242,140,40,.13); stroke: rgba(242,140,40,.55); stroke-width: 1; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; }
.map__hot.lv-high { fill: rgba(240,88,93,.12); stroke: rgba(240,88,93,.7); }
.mk { cursor: pointer; }
.mk .mk__shape { stroke: rgba(7,11,16,.9); stroke-width: 1; vector-effect: non-scaling-stroke; transition: transform var(--fw-motion-duration-fast); }
.mk:hover .mk__shape, .mk.is-selected .mk__shape { stroke: var(--fw-color-text-primary); stroke-width: 2; }
.mk--f1 .mk__shape { fill: var(--fw-color-thermal-300); } .mk--f2 .mk__shape { fill: var(--fw-color-thermal-500); } .mk--f3 .mk__shape { fill: var(--fw-color-high-500); }
.mk--evt .mk__shape { fill: var(--fw-color-sensor-fused); }
.mk__pulse { fill: none; stroke: var(--fw-color-thermal-300); stroke-width: 1.4; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; animation: fw-pulse var(--fw-motion-duration-pulse) var(--fw-motion-easing-standard) infinite; }
.cl { cursor: pointer; }
.cl circle.cl__halo { fill: rgba(242,140,40,.16); }
.cl circle.cl__core { fill: #2B1A0D; stroke: var(--fw-color-thermal-500); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.cl.lv-high circle.cl__core { stroke: var(--fw-color-high-500); fill: #2A1215; }
.cl.lv-high circle.cl__halo { fill: rgba(240,88,93,.16); }
[data-theme="light"] .cl circle.cl__core { fill: #FFF3E6; }
.cl text { fill: var(--fw-color-text-primary); font-family: var(--fw-font-family-mono); font-weight: 500; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.cl:hover circle.cl__core { stroke-width: 2.4; }
.map__ctrl { position: absolute; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.map__ctrl--tr { top: 12px; right: 12px; }
.map__ctrl--tl { top: 12px; left: 12px; flex-direction: row; flex-wrap: wrap; }
.map__ctrl--bl { left: 12px; bottom: 12px; }
.map__ctrl--br { right: 12px; bottom: 12px; align-items: flex-end; }
.map__btngroup { display: flex; flex-direction: column; background: rgba(17,25,34,.92); border: 1px solid var(--fw-color-border-default); border-radius: var(--fw-radius-sm); overflow: hidden; backdrop-filter: blur(6px); }
[data-theme="light"] .map__btngroup, [data-theme="light"] .map-legend, [data-theme="light"] .map__readout, [data-theme="light"] .popup { background: rgba(255,255,255,.95); }
.map__btngroup button { width: 34px; height: 34px; border: 0; background: transparent; cursor: pointer; color: var(--fw-color-text-secondary); display: grid; place-items: center; }
.map__btngroup button + button { border-top: 1px solid var(--fw-color-border-subtle); }
.map__btngroup button:hover { background: var(--fw-color-bg-surface3); color: var(--fw-color-text-primary); }
.map__btngroup button svg { width: 16px; height: 16px; }
.map__views { display: flex; gap: 0; background: rgba(17,25,34,.92); border: 1px solid var(--fw-color-border-default); border-radius: var(--fw-radius-sm); padding: 3px; backdrop-filter: blur(6px); }
.map__views button { border: 0; background: transparent; color: var(--fw-color-text-secondary); height: 28px; padding: 0 10px; border-radius: 4px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
.map__views button[aria-pressed="true"] { background: var(--fw-color-bg-surface3); color: var(--fw-color-text-primary); }
.map__readout { font-family: var(--fw-font-family-mono); font-size: 11px; color: var(--fw-color-text-secondary); background: rgba(17,25,34,.85); border: 1px solid var(--fw-color-border-subtle); padding: 4px 8px; border-radius: 4px; }
.map__scale { display: flex; flex-direction: column; gap: 2px; font-size: 10.5px; color: var(--fw-color-text-secondary); font-family: var(--fw-font-family-mono); }
.map__scale i { display: block; height: 5px; border: 1px solid var(--fw-color-text-secondary); border-top: 0; }
.map__tag { position: absolute; left: 12px; bottom: 12px; z-index: 2; }
.map__empty { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; pointer-events: none; }
.map__empty .state { pointer-events: auto; background: rgba(11,17,24,.88); border: 1px solid var(--fw-color-border-default); border-radius: var(--fw-radius-md); min-height: 0; padding: 22px 26px; backdrop-filter: blur(4px); }
.map-legend { background: rgba(17,25,34,.94); border: 1px solid var(--fw-color-border-default); border-radius: var(--fw-radius-md); padding: 10px 12px; font-size: 12px; min-width: 210px; backdrop-filter: blur(6px); box-shadow: var(--fw-shadow-2); }
.map-legend h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fw-color-text-muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.map-legend h4 button { all: unset; cursor: pointer; color: var(--fw-color-text-muted); font-size: 11px; }
.map-legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.map-legend li { display: flex; align-items: center; gap: 8px; color: var(--fw-color-text-secondary); }
.map-legend li svg { flex-shrink: 0; }
.map-legend .sep { height: 1px; background: var(--fw-color-border-subtle); margin: 8px 0; }
.popup { position: absolute; z-index: 5; width: 300px; background: rgba(17,25,34,.97); border: 1px solid var(--fw-color-border-strong); border-radius: var(--fw-radius-md); box-shadow: var(--fw-shadow-3); animation: fw-pop var(--fw-motion-duration-base) var(--fw-motion-easing-emphasized) both; }
.popup__head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 14px; border-bottom: 1px solid var(--fw-color-border-subtle); }
.popup__head h3 { margin: 0; font-size: 13px; font-weight: 600; }
.popup__head .btn { margin-left: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 14px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--fw-color-text-muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--fw-font-family-mono); font-size: 12px; color: var(--fw-color-text-primary); }
.kv dd.sans { font-family: var(--fw-font-family-sans); }
.popup__foot { padding: 10px 14px 12px; border-top: 1px solid var(--fw-color-border-subtle); font-size: 11.5px; color: var(--fw-color-text-muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- Carte mondiale (écran) ---------- */
.mapscreen { display: grid; grid-template-columns: var(--fw-size-filter-panel) 1fr; height: 100%; min-height: 0; }
.mapscreen__panel { border-right: 1px solid var(--fw-color-border-subtle); background: var(--fw-color-bg-surface1); overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
.mapscreen__map { position: relative; min-height: 0; }
.filters { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.filters__group { display: flex; flex-direction: column; gap: 8px; }
.filters__group > .label { display: flex; justify-content: space-between; align-items: center; }
.filters__chips { display: flex; flex-wrap: wrap; gap: 6px; }
.filters__foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--fw-color-border-subtle); display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--fw-color-bg-surface1); }

/* ---------- Graphiques ---------- */

/* ---------- Listes ---------- */

/* ---------- Timeline observations ---------- */
.otl { position: relative; padding: 8px 0 4px; }

.otl__ticklbl { position: absolute; top: 8px; transform: translateX(-50%); font-size: 10.5px; font-family: var(--fw-font-family-mono); color: var(--fw-color-text-muted); white-space: nowrap; }
.otl__obs { position: absolute; top: -26px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; cursor: pointer; padding: 0; }

/* ---------- Comparaison ---------- */
.compare-maps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--fw-space-3); }

/* ---------- Méthodologie ---------- */
.method { padding: 18px; }

.formula { font-family: var(--fw-font-family-mono); font-size: 13px; background: var(--fw-color-bg-sunken); border: 1px solid var(--fw-color-border-subtle); border-radius: var(--fw-radius-sm); padding: 12px 14px; overflow-x: auto; white-space: pre; color: var(--fw-color-text-primary); line-height: 1.7; }

/* ---------- Assistant IA ---------- */
.assistant { position: absolute; top: 0; right: 0; bottom: 0; width: var(--fw-size-assistant-panel); max-width: 100%; background: var(--fw-color-bg-surface1); border-left: 1px solid var(--fw-color-border-default); box-shadow: var(--fw-shadow-3); z-index: var(--fw-z-drawer); display: flex; flex-direction: column; transform: translateX(105%); transition: transform var(--fw-motion-duration-base) var(--fw-motion-easing-emphasized); visibility: hidden; }

.assistant--page { position: relative; transform: none; visibility: visible; width: auto; box-shadow: none; border: 1px solid var(--fw-color-border-subtle); border-radius: var(--fw-radius-md); height: calc(100% - 0px); min-height: 560px; z-index: 1; }

.msg { max-width: 92%; font-size: 13.5px; line-height: 1.55; animation: fw-fade-up var(--fw-motion-duration-base) var(--fw-motion-easing-standard) both; }
.msg--user { align-self: flex-end; background: var(--fw-color-bg-surface3); border: 1px solid var(--fw-color-border-default); padding: 9px 12px; border-radius: 12px 12px 4px 12px; }
.msg--bot { align-self: flex-start; }
.msg--bot .msg__body { background: var(--fw-color-bg-surface2); border: 1px solid var(--fw-color-border-subtle); padding: 10px 12px; border-radius: 12px 12px 12px 4px; }

.msg__src { margin-top: 6px; font-size: 11px; color: var(--fw-color-text-muted); font-family: var(--fw-font-family-mono); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.msg__src code { background: var(--fw-color-bg-surface2); border: 1px solid var(--fw-color-border-subtle); padding: 1px 6px; border-radius: 4px; }
.msg--err .msg__body { border-color: rgba(240,88,93,.4); background: var(--fw-color-high-bg); }
.typing { display: inline-flex; gap: 4px; padding: 12px 14px; background: var(--fw-color-bg-surface2); border: 1px solid var(--fw-color-border-subtle); border-radius: 12px 12px 12px 4px; align-self: flex-start; align-items: center; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--fw-color-text-muted); animation: fw-bounce 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }

.suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.suggest button { border: 1px solid var(--fw-color-border-default); background: transparent; border-radius: 99px; padding: 6px 11px; font-size: 12.5px; color: var(--fw-color-text-secondary); cursor: pointer; text-align: left; }

.assistant__disclaimer svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--fw-color-nasa-500); }

.assistant__form textarea { flex: 1; resize: none; min-height: 40px; max-height: 120px; background: var(--fw-color-bg-surface2); border: 1px solid var(--fw-color-border-default); border-radius: var(--fw-radius-sm); padding: 9px 11px; color: var(--fw-color-text-primary); line-height: 1.4; }
.assistant__layout { display: grid; grid-template-columns: 260px 1fr; gap: var(--fw-space-4); height: calc(100% - 0px); }
.history { padding: 12px; }
.history button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: var(--fw-radius-sm); color: var(--fw-color-text-secondary); cursor: pointer; font-size: 13px; }
.history button:hover, .history button[aria-current="true"] { background: var(--fw-color-bg-surface2); color: var(--fw-color-text-primary); }
.history small { display: block; font-size: 11px; color: var(--fw-color-text-muted); }
.fab { position: absolute; right: 20px; bottom: 20px; z-index: var(--fw-z-fab); height: 48px; padding: 0 18px 0 14px; border-radius: 99px; border: 1px solid rgba(76,201,240,.5); background: linear-gradient(135deg, #12303D, #1A2440); color: var(--fw-color-text-primary); display: inline-flex; align-items: center; gap: 9px; cursor: pointer; box-shadow: var(--fw-shadow-2), 0 0 0 4px rgba(76,201,240,.06); font-weight: 600; transition: transform var(--fw-motion-duration-fast) var(--fw-motion-easing-standard); }
[data-theme="light"] .fab { background: var(--fw-color-nasa-500); color: #fff; }
.fab:hover { transform: translateY(-2px); }
.fab svg { width: 20px; height: 20px; color: var(--fw-color-nasa-300); }
[data-theme="light"] .fab svg { color: #fff; }
.scrim { position: absolute; inset: 0; background: var(--fw-color-bg-overlay); z-index: calc(var(--fw-z-drawer) - 1); opacity: 0; pointer-events: none; transition: opacity var(--fw-motion-duration-base); }

/* ---------- Toasts ---------- */
.toasts { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: var(--fw-z-toast); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; background: var(--fw-color-bg-surface3); border: 1px solid var(--fw-color-border-strong); border-left: 3px solid var(--fw-color-nasa-500); border-radius: var(--fw-radius-sm); padding: 10px 12px; box-shadow: var(--fw-shadow-3); font-size: 13px; max-width: 460px; animation: fw-toast var(--fw-motion-duration-base) var(--fw-motion-easing-emphasized) both; }

.toast--warn { border-left-color: var(--fw-color-feedback-warning); } .toast--warn svg { color: var(--fw-color-feedback-warning); }
.toast--err { border-left-color: var(--fw-color-feedback-danger); } .toast--err svg { color: var(--fw-color-feedback-danger); }

.toast strong { display: block; }
.toast button { margin-left: 8px; }

/* ---------- Bottom nav mobile ---------- */
.bnav { display: none; }

/* ---------- Design system (écran annexe) ---------- */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.swatch { border: 1px solid var(--fw-color-border-subtle); border-radius: var(--fw-radius-sm); overflow: hidden; font-size: 11.5px; }
.swatch i { display: block; height: 52px; }
.swatch div { padding: 7px 9px; }
.swatch code { font-family: var(--fw-font-family-mono); color: var(--fw-color-text-muted); font-size: 11px; display: block; }
.typo-row { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--fw-color-border-subtle); }
.space-row { display: flex; align-items: center; gap: 12px; font-size: 12px; font-family: var(--fw-font-family-mono); color: var(--fw-color-text-secondary); padding: 3px 0; }
.space-row i { height: 12px; background: var(--fw-color-nasa-500); border-radius: 2px; opacity: .7; }
.states-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--fw-space-3); }
.states-grid .card { min-height: 260px; }

/* ---------- Animations ---------- */
@keyframes fw-fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fw-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fw-toast { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fw-shimmer { to { transform: translateX(100%); } }
@keyframes fw-scan { to { left: 100%; } }
@keyframes fw-pulse { 0% { transform: scale(1); opacity: .9; } 70% { transform: scale(2.6); opacity: 0; } 100% { transform: scale(2.6); opacity: 0; } }
@keyframes fw-draw { to { stroke-dashoffset: 0; } }
@keyframes fw-bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0ms !important; transition-duration: 0ms !important; } .chart__draw { stroke-dashoffset: 0; } }

  };
  const icon = (name, cls = '') => `<svg class="${cls}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${P[name] || ''}</svg>`;

  // symboles de forme (capteur / événement) — la forme double toujours la couleur
  const shape = (kind, size = 12, fillVar) => {
    const s = size, h = s / 2; const fill = fillVar || (kind === 'MODIS' ? 'var(--fw-color-sensor-modis)' : kind === 'VIIRS' ? 'var(--fw-color-sensor-viirs)' : 'var(--fw-color-sensor-fused)');
    const body = kind === 'MODIS' ? `<rect x="1" y="1" width="${s - 2}" height="${s - 2}" rx="1.5" fill="${fill}"/>` : kind === 'VIIRS' ? `<circle cx="${h}" cy="${h}" r="${h - 1}" fill="${fill}"/>` : `<path d="M${h} 0.5 L${s - 0.5} ${h} L${h} ${s - 0.5} L0.5 ${h}Z" fill="${fill}"/>`;
    return `<svg class="sym" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true">${body}</svg>`;
  };

  // ---------- badges ----------
  const LEVEL = { low: { label: 'Faible', ico: '▽' }, moderate: { label: 'Modéré', ico: '◆' }, high: { label: 'Élevé', ico: '▲' } };
  const LevelBadge = (lv, pill = false) => `<span class="lvl lvl--${lv}${pill ? ' pill' : ''}"><span class="lvl__ico" aria-hidden="true">${LEVEL[lv].ico}</span>${LEVEL[lv].label}</span>`;
  const CONF = { low: 'Faible', nominal: 'Nominale', high: 'Élevée' };
  const ConfidenceBadge = (d) => { const raw = d.instrument === 'MODIS' ? `${d.confidence} %` : String(d.confidence).toUpperCase(); return `<span class="conf conf--${d.conf_class}" title="Valeur brute FIRMS : ${esc(raw)}"><span class="conf__bars" aria-hidden="true"><i></i><i></i><i></i></span>${CONF[d.conf_class]} <span class="muted mono small">(${esc(raw)})</span></span>`; };
  const SatelliteBadge = (satId) => { const s = D.SAT[satId]; return `<span class="badge badge--${s.sensor.toLowerCase()}">${shape(s.sensor, 9)}${esc(s.label)}</span>`; };
  const SensorBadge = (sensor) => `<span class="badge badge--${sensor.toLowerCase()}">${shape(sensor, 9)}${sensor} <span class="muted" style="font-weight:500">${sensor === 'MODIS' ? '≈1 km' : '375 m'}</span></span>`;
  const DemoBadge = (txt = 'DÉMO') => `<span class="badge badge--demo" title="Données de démonstration générées localement — non issues d'observations réelles">${txt}</span>`;
  const ExpBadge = () => `<span class="badge badge--exp">${icon('alert')}Expérimental</span>`;
  const HarmonizationScore = (score, size = 44, label = true) => {
    const r = size / 2 - 4, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, score));
    return `<span class="hscore${size > 60 ? ' hscore--lg' : ''}" role="img" aria-label="Score d'harmonisation ${fmt.d2(score)} sur 1"><span class="hscore__ring"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--fw-color-bg-surface3)" stroke-width="${size > 60 ? 7 : 4}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--fw-color-sensor-fused)" stroke-width="${size > 60 ? 7 : 4}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - v)}" style="transition: stroke-dashoffset .6s var(--fw-motion-easing-standard)"/></svg><b>${fmt.d2(score)}</b></span>${label ? `<span class="small muted">${v >= 0.75 ? 'Rapprochement fort' : v >= 0.5 ? 'Rapprochement modéré' : 'Rapprochement faible'}</span>` : ''}</span>`;
  };

  // ---------- états ----------
  const STATE_COPY = {
    empty: { ico: 'inbox', t: 'Aucune donnée disponible', p: 'Aucune détection thermique n’a été enregistrée pour cette période et cette zone. Essayez une période plus longue.' },
    noresult: { ico: 'filter', t: 'Aucun résultat pour ces filtres', p: 'Les filtres actifs excluent toutes les détections. Élargissez la période, réactivez un capteur ou abaissez le niveau de confiance.' },
    offline: { ico: 'wifiOff', t: 'Vous êtes hors connexion', p: 'Les données affichées proviennent du cache local. Elles seront actualisées dès le retour de la connexion.' },
    geoloc: { ico: 'pinOff', t: 'Position indisponible', p: 'Votre position n’a pas pu être déterminée (autorisation refusée ou signal insuffisant). La vue Afrique est utilisée par défaut.' },
    emptymap: { ico: 'globe', t: 'Aucune détection dans cette vue', p: 'La zone visible ne contient aucune détection pour les filtres actuels. Dézoomez ou revenez à la vue mondiale.' },
  };
  const EmptyState = (kind = 'empty', actions = '') => { const c = STATE_COPY[kind]; return `<div class="state state--${kind === 'noresult' ? 'filter' : kind}" role="status"><div class="state__ico">${icon(c.ico)}</div><h3>${c.t}</h3><p>${c.p}</p>${actions ? `<div class="row" style="justify-content:center;margin-top:6px">${actions}</div>` : ''}</div>`; };
  const ErrorState = (err) => `<div class="state state--error" role="alert"><div class="state__ico">${icon('server')}</div><h3>Les données n’ont pas pu être chargées</h3><p>${esc(err?.message || 'Erreur inconnue.')} Vos filtres sont conservés ; réessayez dans quelques instants.</p><code>${esc(err?.status || 'ERR')} · ${esc(err?.code || '')} · GET ${esc((err?.path || '').split('?')[0])}</code><div class="row" style="justify-content:center;margin-top:6px"><button class="btn btn--sm" data-action="retry">${icon('refresh')}Réessayer</button><a class="btn btn--sm btn--ghost" href="#methodologie">État des sources</a></div></div>`;
  const LoadingState = (variant = 'block', h = 220) => {
    if (variant === 'stats') return `<div class="stats" aria-busy="true" aria-label="Chargement des indicateurs">${Array.from({ length: 6 }, () => `<div class="card stat"><div class="skel" style="height:12px;width:60%"></div><div class="skel" style="height:28px;width:70%;margin-top:12px"></div><div class="skel" style="height:10px;width:40%;margin-top:10px"></div></div>`).join('')}</div>`;
    if (variant === 'chart') return `<div aria-busy="true" style="height:${h}px;display:flex;align-items:flex-end;gap:6px;padding:10px 0">${Array.from({ length: 28 }, (_, i) => `<div class="skel" style="flex:1;height:${25 + 60 * Math.abs(Math.sin(i / 3))}%"></div>`).join('')}</div>`;
    if (variant === 'list') return `<div aria-busy="true">${Array.from({ length: 5 }, () => `<div style="display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--fw-color-border-subtle)"><div class="skel" style="width:22px;height:14px"></div><div style="flex:1"><div class="skel" style="height:12px;width:70%"></div><div class="skel" style="height:8px;width:40%;margin-top:8px"></div></div></div>`).join('')}</div>`;
    if (variant === 'map') return `<div class="map" aria-busy="true" aria-label="Chargement de la carte" style="display:grid;place-items:center"><div style="text-align:center"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--fw-color-border-default)" stroke-width="1"/><circle cx="32" cy="32" r="16" fill="none" stroke="var(--fw-color-border-subtle)" stroke-width="1"/><path d="M32 6 A26 26 0 0 1 58 32" fill="none" stroke="var(--fw-color-nasa-500)" stroke-width="2" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="1.6s" repeatCount="indefinite"/></path></svg><div class="small muted" style="margin-top:8px">Chargement des détections…</div></div></div>`;
    return `<div aria-busy="true" style="padding:4px 0"><div class="skel" style="height:${h}px"></div></div>`;
  };

  // ---------- StatCard ----------
  const StatCard = ({ label, value, unit, foot, sym, accent, spark, demo }) => `<div class="card stat${accent ? ' stat--accent' : ''}"><div class="stat__label">${sym || ''}${esc(label)}${demo ? DemoBadge() : ''}</div><div class="stat__row"><div class="stat__value">${value}${unit ? `<small>${unit}</small>` : ''}</div>${spark ? `<div class="stat__spark">${spark}</div>` : ''}</div><div class="stat__foot">${foot || ''}</div></div>`;
  const sparkline = (vals, w = 76, h = 26, color = 'var(--fw-color-thermal-500)') => { if (!vals.length) return ''; const mx = Math.max(1, ...vals); const pts = vals.map((v, i) => `${(i / Math.max(1, vals.length - 1)) * w},${h - 2 - (v / mx) * (h - 4)}`).join(' '); return `<svg width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`; };

  // ---------- tableau ----------
  const DataTable = ({ cols, rows, caption, rowAttr, max }) => `<div class="table-wrap"${max ? ` style="max-height:${max}px"` : ''}><table class="table">${caption ? `<caption class="sr-only">${esc(caption)}</caption>` : ''}<thead><tr>${cols.map((c) => `<th scope="col" class="${c.r ? 'r' : ''}">${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map((r, i) => `<tr ${rowAttr ? rowAttr(r, i) : ''}>${cols.map((c) => `<td class="${c.r ? 'r' : ''}${c.mono ? ' num' : ''}">${c.v(r, i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  // ---------- toasts ----------
  function toast(title, body, kind = 'info', ms = 5200) {
    const box = document.querySelector('.toasts'); if (!box) return;
    const el = document.createElement('div'); el.className = `toast toast--${kind}`; el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
    el.innerHTML = `${icon(kind === 'err' ? 'alert' : kind === 'warn' ? 'alert' : kind === 'ok' ? 'check' : 'info')}<div><strong>${esc(title)}</strong>${body ? `<span class="secondary">${esc(body)}</span>` : ''}</div><button class="btn btn--ghost btn--sm btn--icon" aria-label="Fermer la notification">${icon('x')}</button>`;
    el.querySelector('button').onclick = () => el.remove(); box.appendChild(el); setTimeout(() => el.remove(), ms);
  }

  // ==========================================================================
  // Graphiques SVG (TimelineChart, BarChart, HeatmapCalendar)
  // ==========================================================================
  const niceMax = (v) => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };
  const shortDate = (k, gran) => { const [y, m, d] = k.split('-'); const mois = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.']; return gran === 'month' ? `${mois[+m - 1]} ${y}` : `${+d} ${mois[+m - 1]}`; };

  function TimelineChart(el, { x, series, height = 220, gran = 'day', unusual = [], yFormat = fmt.n, caption, stacked = false, area = true }) {
    const W = Math.max(280, el.clientWidth || 600), H = height, m = { t: 12, r: 12, b: 26, l: 40 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b; const n = x.length;
    const ymax = niceMax(Math.max(1, ...x.map((_, i) => (stacked ? series.reduce((s, se) => s + se.values[i], 0) : Math.max(...series.map((se) => se.values[i]))))));
    const X = (i) => m.l + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw), Y = (v) => m.t + ih - (v / ymax) * ih;
    const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * ymax);
    const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 70))));
    let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(caption || 'Graphique temporel')}"><g class="grid">${ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/>`).join('')}</g><g class="axis">${ticks.map((t) => `<text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${yFormat(t)}</text>`).join('')}${x.map((k, i) => (i % every === 0 ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${shortDate(k, gran)}</text>` : '')).join('')}</g>`;
    const base = new Array(n).fill(0);
    series.forEach((se, si) => {
      const top = se.values.map((v, i) => (stacked ? base[i] + v : v));
      const pts = top.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
      if (area) { const bottom = stacked ? base.map((v, i) => `${X(i)},${Y(v)}`).reverse().join(' ') : `${X(n - 1)},${Y(0)} ${X(0)},${Y(0)}`; s += `<polygon class="chart__area" points="${pts} ${bottom}" fill="${se.color}"/>`; }
      s += `<polyline class="chart__line chart__draw" points="${pts}" stroke="${se.color}" ${se.dash ? `stroke-dasharray="${se.dash}" style="animation:none;stroke-dashoffset:0"` : ''} style="animation-delay:${si * 120}ms"/>`;
      if (stacked) top.forEach((v, i) => (base[i] = v));
    });
    unusual.forEach((i) => { const v = stacked ? base[i] : Math.max(...series.map((se) => se.values[i])); s += `<g><path d="M${X(i)} ${Y(v) - 14} l5 8 h-10z" fill="var(--fw-color-text-primary)"/><title>Jour inhabituel : ${shortDate(x[i])}</title></g>`; });
    s += `<line class="chart__rule" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" style="display:none"/>`;
    s += `<rect class="chart__hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}"/></svg><div class="tooltip" aria-hidden="true"></div>`;
    el.innerHTML = s; el.classList.add('chart');
    const svg = el.querySelector('svg'), rule = el.querySelector('.chart__rule'), tip = el.querySelector('.tooltip');
    el.querySelector('.chart__hit').addEventListener('pointermove', (ev) => {
      const r = svg.getBoundingClientRect(); const px = ev.clientX - r.left; const i = Math.max(0, Math.min(n - 1, Math.round(((px - m.l) / iw) * (n - 1))));

  // ---------- bannières d'état global ----------
  function banners() {
    const st = API.state; const b = document.getElementById('banners'); let h = '';
    if (st === 'partial') h += `<div class="banner banner--warn">${icon('alert')}<span><strong>Données partielles.</strong> L’ingestion VIIRS NOAA-21 (VJ214IMGTDL_NRT) est incomplète depuis le 13/11 18:00 UTC. Les totaux affichés excluent ce satellite.</span><a class="btn btn--sm btn--ghost" href="#methodologie">Détails</a></div>`;
    if (st === 'offline') h += `<div class="banner banner--offline">${icon('wifiOff')}<span><strong>Absence de connexion.</strong> Affichage du cache local du <span class="mono">14/11/2026 06:00 UTC</span>. Les actions de mise à jour sont suspendues.</span><button class="btn btn--sm" data-action="retry">${icon('refresh')}Réessayer</button></div>`;
    if (st === 'error') h += `<div class="banner banner--err">${icon('server')}<span><strong>Service dégradé.</strong> <span class="mono">GET /api/health</span> signale un délai dépassé sur l’ingestion FIRMS.</span><button class="btn btn--sm" data-action="retry">${icon('refresh')}Réessayer</button></div>`;
    if (st === 'geoloc') h += `<div class="banner banner--info">${icon('pinOff')}<span><strong>Erreur de localisation.</strong> Votre position n’a pas pu être déterminée ; la vue Afrique est utilisée. Vous pouvez choisir une région manuellement.</span></div>`;
    b.innerHTML = h;
    const dot = document.getElementById('fresh-dot'); dot.className = 'fw-dot' + (st === 'error' ? ' fw-dot--err' : st === 'partial' || st === 'offline' ? ' fw-dot--warn' : '');
  }
  async function loadMeta() {
    document.getElementById('fresh-time').textContent = '…';

      const t = new Date(m.data.last_update); document.getElementById('fresh-time').textContent = `${String(t.getUTCDate()).padStart(2, '0')}/${String(t.getUTCMonth() + 1).padStart(2, '0')} ${t.toISOString().slice(11, 16)} UTC${API.state === 'offline' ? ' (cache)' : ''}`;
      document.getElementById('health-dot').className = 'fw-dot' + (h.data.status === 'ok' ? (API.state === 'partial' ? ' fw-dot--warn' : '') : ' fw-dot--err');
      document.getElementById('health-txt').innerHTML = `API ${h.data.status === 'ok' ? 'opérationnelle' : 'dégradée'} · <span class="mono">v${h.data.version}</span>`;

    } catch (e) { document.getElementById('fresh-time').textContent = 'indisponible'; document.getElementById('health-txt').textContent = 'API indisponible'; document.getElementById('health-dot').className = 'fw-dot fw-dot--err'; }
  }

  // ---------- routeur ----------
  function parseHash() { const raw = location.hash.replace(/^#\/?/, '') || 'dashboard'; const [path, q] = raw.split('?'); let parts = path.split('/'); if (/^evenement-/.test(path)) parts = ['evenements', path.slice(10)]; const qs = new URLSearchParams(q || ''); return { route: parts[0] || 'dashboard', param: parts[1] ? decodeURIComponent(parts[1]) : null, qs }; }
  async function navigate() {
    const { route, param, qs } = parseHash();
    if (qs.get('state') && D.SIM_STATES[qs.get('state')]) { API.state = qs.get('state'); document.getElementById('sim-state').value = API.state; }
    if (qs.get('frame')) setFrame(qs.get('frame'));
    if (qs.get('chrome') === '0') document.querySelector('.fw-stage__bar').style.display = 'none';
    if (qs.get('theme')) { APP.settings.theme = qs.get('theme'); APP.applySettings(); }
    if (qs.get('assistant') === 'open') setTimeout(() => openAssistant(true), 50);
    let r = route; if (r === 'evenements' && param) r = 'evenement';
    if (!window.FW_SCREENS[r]) r = 'dashboard';
    APP.route = r; APP.param = param; document.getElementById('app').dataset.route = r;
    APP.maps.forEach((m) => m.destroy?.()); APP.maps = [];
    document.querySelectorAll('[data-route]').forEach((a) => { const cur = a.dataset.route === route || (route === 'evenements' && a.dataset.route === 'evenements'); a.toggleAttribute('aria-current', false); if (cur) a.setAttribute('aria-current', 'page'); });
    document.getElementById('page-title').textContent = TITLES[r]; document.getElementById('crumbs').textContent = 'FireWatch Africa › ' + CRUMB[r];
    document.title = `${TITLES[r]} — FireWatch Africa`;
    document.getElementById('sim-route').value = route === 'evenements' && param ? `evenement-${param}` : route;
    closeNav(); banners();
    const main = document.getElementById('main'); main.scrollTop = 0; main.innerHTML = '';
    const page = document.createElement('div'); page.className = 'fw-page' + (window.FW_SCREENS[r].flush ? ' fw-page--flush' : ''); main.appendChild(page);
    try { await window.FW_SCREENS[r].render(page, param); } catch (e) { console.error(e); }
    if (API.state === 'geoloc' && (r === 'carte' || r === 'dashboard' || r === 'gabon')) U.toast('Position indisponible', 'GeolocationPositionError · code 1 (PERMISSION_DENIED). Vue Afrique utilisée.', 'warn');
    if (API.state === 'offline') U.toast('Mode hors connexion', 'Les données affichées datent du dernier cache.', 'warn', 3500);
  }
  APP.rerender = () => navigate();
  APP.go = (h) => { location.hash = h; };

  // ---------- cadre d'aperçu ----------
  function setFrame(f) { APP.frame = f; document.querySelector('.fw-stage').dataset.frame = f; document.querySelectorAll('[data-frame]').forEach((b) => b.tagName === 'BUTTON' && b.setAttribute('aria-pressed', b.dataset.frame === f)); setTimeout(() => window.dispatchEvent(new Event('resize')), 60); }
  function openNav() { document.getElementById('app').classList.add('nav-open'); document.getElementById('scrim').classList.add('is-on'); document.querySelectorAll('[data-action="nav"]').forEach((b) => b.setAttribute('aria-expanded', 'true')); }
  function closeNav() { const a = document.getElementById('app'); if (!a) return; a.classList.remove('nav-open'); if (!document.getElementById('assistant-panel').classList.contains('is-open')) document.getElementById('scrim').classList.remove('is-on'); document.querySelectorAll('[data-action="nav"]').forEach((b) => b.setAttribute('aria-expanded', 'false')); }

  // ==========================================================================
  // Assistant IA — moteur de démonstration (réponses calculées depuis l'API)
  // ==========================================================================
  const SUGGESTIONS = ['Quelles sont les zones les plus actives aujourd’hui ?', 'Quelle est la différence entre MODIS et VIIRS ?', 'Pourquoi cet événement a-t-il un score de 0,72 ?', 'Combien de détections ont été observées au Gabon cette semaine ?', 'Résume la carte actuelle', 'Que signifie le niveau de confiance ?'];
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  async function answer(q) {
    const n = norm(q); const src = []; const call = async (p, params) => { src.push(API.url(p, params)); return (await API.get(p, params)).data; };
    const last7 = { start_date: '2026-11-08', end_date: '2026-11-14' };
    if (/zone|actif|active|chaud|concentration/.test(n) && !/gabon/.test(n)) {
      const p = { start_date: '2026-11-13', end_date: '2026-11-14', limit: 3, min_count: 2 }; const hs = await call('/api/analytics/hotspots', p);
      if (!hs.length) return { html: `<p>Aucune zone ne dépasse le seuil de concentration sur les dernières 24 h pour les données disponibles. Je ne peux donc pas en citer.</p>`, src };
      return { html: `<p>Sur les dernières 24 h (13–14/11/2026, UTC), les cellules de 1° présentant la plus forte concentration de détections sont :</p><ul>${hs.map((h) => `<li><strong>${esc(h.name)}</strong> — ${fmt.n(h.count)} détections, ${h.active_days} jour(s) actif(s), FRP cumulée ${fmt.d1(h.frp_sum)} MW · score ${h.score} (${U.LEVEL[h.level].label.toLowerCase()})</li>`).join('')}</ul><p>Il s’agit de zones présentant une concentration élevée de <em>détections thermiques</em> : elles ne confirment pas à elles seules un incendie au sol.</p>`, src, actions: [['Ouvrir les zones', '#zones']] };
    }
    if (/modis|viirs|capteur|resolution/.test(n)) {
      const s = await call('/api/statistics/satellites', APP.params()); const m = s.filter((x) => x.sensor === 'MODIS'), v = s.filter((x) => x.sensor === 'VIIRS');
      const cm = m.reduce((a, x) => a + x.count, 0), cv = v.reduce((a, x) => a + x.count, 0);
      return { html: `<p><strong>MODIS</strong> (Terra, Aqua) observe des pixels d’environ <strong>1 km</strong> ; <strong>VIIRS</strong> (Suomi-NPP, NOAA-20, NOAA-21) des pixels de <strong>375 m</strong>. VIIRS détecte donc des foyers plus petits ou moins intenses, et localise plus finement.</p><ul><li>Une même source de chaleur peut produire plusieurs détections VIIRS pour une seule détection MODIS.</li><li>La confiance n’est pas exprimée de la même façon : 0–100 % pour MODIS, faible / nominale / élevée pour VIIRS.</li><li>Les heures de passage diffèrent (Terra ≈ 10 h 30 et 22 h 30 locales, les autres ≈ 13 h 30 et 01 h 30).</li></ul><p>Sur la période sélectionnée (${APP.periodLabel()}) : ${fmt.n(cv)} détections VIIRS et ${fmt.n(cm)} détections MODIS dans les données disponibles.</p>`, src, actions: [['Comparer MODIS / VIIRS', '#comparaison']] };
    }
    if (/score|0[,.]72|rapproch|harmonis/.test(n)) {
      const id = APP.route === 'evenement' && APP.param ? APP.param : 'EVT-GA-0007'; const e = await call(`/api/events/${id}`);
      const w = e.analysis.params.w; const sub = e.sub;
      return { html: `<p>L’événement <strong class="mono">${esc(e.id)}</strong> obtient un score d’harmonisation de <strong>${fmt.d2(e.score)}</strong>, moyenne pondérée de quatre composantes :</p><ul><li>Cohérence spatiale <span class="mono">${fmt.d2(sub.spatial)}</span> × ${fmt.d2(w.spatial)} — distance moyenne au centre ${fmt.d2(e.dmean)} km pour un seuil de ${fmt.d1(e.dmax)} km${e.sensors.includes('MODIS') ? ' (MODIS impliqué)' : ''}.</li><li>Cohérence temporelle <span class="mono">${fmt.d2(sub.temporel)}</span> × ${fmt.d2(w.temporel)} — écart médian ${fmt.d1(e.gapMedian)} h pour une fenêtre de 24 h.</li><li>Convergence des plateformes <span class="mono">${fmt.d2(sub.capteurs)}</span> × ${fmt.d2(w.capteurs)} — ${e.satellites.length} satellite(s) : ${e.satellites.join(', ')}.</li><li>Confiance moyenne <span class="mono">${fmt.d2(sub.confiance)}</span> × ${fmt.d2(w.confiance)}.</li></ul><p>Le score est principalement limité par la confiance moyenne et par l’écart spatial. Il mesure la cohérence du rapprochement des observations, <em>pas</em> la certitude qu’un feu ait eu lieu.</p>`, src, actions: [['Voir l’événement', `#evenement-${e.id}`]] };
    }
    if (/gabon/.test(n)) {
      const s = await call('/api/statistics/summary', { ...last7, bbox: D.REGIONS.gabon.bbox.join(',') }); const det = await call('/api/detections', { ...last7, bbox: D.REGIONS.gabon.bbox.join(','), limit: 500 });
      const byP = {}; det.items.forEach((d) => { if (d.province) byP[d.province] = (byP[d.province] || 0) + 1; }); const top = Object.entries(byP).sort((a, b) => b[1] - a[1]);
      if (!s.total) return { html: `<p>Aucune détection thermique n’est disponible pour le Gabon entre le 08/11 et le 14/11/2026.</p>`, src };
      return { html: `<p>Du <strong>08/11 au 14/11/2026</strong> (7 jours, UTC), <strong>${fmt.n(s.total)} détections thermiques</strong> ont été enregistrées sur l’emprise du Gabon : ${fmt.n(s.viirs)} VIIRS et ${fmt.n(s.modis)} MODIS, regroupées en ${fmt.n(s.events)} événement(s) probable(s).</p>${top.length ? `<p>Répartition par province : ${top.map(([p, c]) => `${esc(p)} (${c})`).join(', ')}.</p>` : ''}<p>Novembre correspond à la saison des pluies sur l’essentiel du pays, ce qui est cohérent avec une activité faible par rapport à août–septembre.</p>`, src, actions: [['Ouvrir la vue Gabon', '#gabon']] };
    }
    if (/resum|carte|synthese|periode/.test(n)) {
      const s = await call('/api/statistics/summary', APP.params()); const hs = await call('/api/analytics/hotspots', APP.params({ limit: 1 }));
      if (!s.total) return { html: `<p>La carte actuelle ne contient aucune détection pour les filtres sélectionnés.</p>`, src };
      return { html: `<p>Pour la période <strong>${APP.periodLabel()}</strong>${APP.filtersActive() ? ' et les filtres actifs' : ''} : <strong>${fmt.n(s.total)}</strong> détections (${fmt.n(s.viirs)} VIIRS, ${fmt.n(s.modis)} MODIS), dont ${Math.round((s.day / s.total) * 100)} % de jour, et <strong>${fmt.n(s.events)}</strong> événements probables.</p><p>FRP moyenne ${fmt.d1(s.frp_mean)} MW, maximale ${fmt.d1(s.frp_max)} MW. ${hs[0] ? `La zone présentant la concentration la plus élevée est <strong>${esc(hs[0].name)}</strong> (${fmt.n(hs[0].count)} détections).` : ''}</p>`, src };
    }
    if (/confiance|filtre|frp|nuit|jour/.test(n)) {
      return { html: `<p><strong>Niveau de confiance</strong> : estimation, fournie par l’algorithme FIRMS, de la probabilité qu’un pixel corresponde à une véritable anomalie thermique. MODIS l’exprime de 0 à 100 % ; VIIRS en trois classes (faible, nominale, élevée). FireWatch harmonise : &lt; 30 % → faible, 30–79 % → nominale, ≥ 80 % → élevée.</p><p><strong>FRP</strong> (Fire Radiative Power) : puissance radiative mesurée en mégawatts — indicateur d’intensité, non de surface brûlée.</p><p><strong>Jour / nuit</strong> : moment du passage satellite ; les détections nocturnes sont moins sujettes aux faux positifs liés aux surfaces chaudes.</p>`, src: [] };
    }
    return { html: `<p>Je n’ai pas de donnée permettant de répondre précisément à cette question, et je préfère ne pas extrapoler.</p><p>Je peux : résumer la carte ou une période, comparer MODIS et VIIRS, expliquer un score d’harmonisation, lister les zones de concentration ou décrire l’activité au Gabon.</p>`, src: [] };
  }
  function renderAssistant(el, page) {
    const msgs = APP.chat;
    const ctx = APP.route === 'evenement' && APP.param ? `Contexte : événement <span class="mono">${esc(APP.param)}</span>` : `Contexte : ${esc(TITLES[APP.route] || '')} · ${APP.periodLabel()}`;
    el.innerHTML = `<div class="assistant__head"><span class="assistant__avatar">${icon('sparkle')}</span><div><h2>Assistant FireWatch</h2><div class="small muted">Interprétation des données disponibles</div></div>${page ? '' : `<button class="btn btn--ghost btn--sm btn--icon" data-action="assistant-close" aria-label="Fermer l’assistant">${icon('x')}</button>`}</div>
      <div class="assistant__ctx">${icon('layers', '')}${ctx} ${U.DemoBadge('MODE DÉMO')}</div>
      <div class="assistant__msgs" role="log" aria-live="polite" aria-label="Conversation">${msgs.length ? '' : `<div class="msg msg--bot"><div class="msg__body"><p>Bonjour. Je peux expliquer les filtres et les termes scientifiques, résumer la carte ou une période, et détailler pourquoi des détections ont été — ou non — rapprochées.</p><p class="small muted" style="margin:0">Mes réponses sont calculées uniquement à partir des endpoints de l’API ; je cite toujours la source.</p></div></div>`}${msgs.map(msgHtml).join('')}</div>
      <div class="suggest" aria-label="Suggestions de questions">${SUGGESTIONS.slice(0, page ? 6 : 4).map((s) => `<button data-suggest="${esc(s)}">${esc(s)}</button>`).join('')}</div>
      <p class="assistant__disclaimer">${icon('info')}<span>L’assistant fournit une interprétation des données disponibles. Il ne remplace pas une analyse scientifique, les autorités locales ou les observations terrain.</span></p>
      <form class="assistant__form"><label class="sr-only" for="q-${page ? 'p' : 'd'}">Votre question</label><textarea id="q-${page ? 'p' : 'd'}" rows="1" placeholder="Posez une question sur les données…"></textarea><button class="btn btn--primary btn--icon" type="submit" aria-label="Envoyer">${icon('send')}</button></form>`;
    const box = el.querySelector('.assistant__msgs'); box.scrollTop = box.scrollHeight;
    const send = async (q) => {
      if (!q.trim()) return; APP.chat.push({ role: 'user', text: q }); if (!APP.chatHistory.includes(q)) APP.chatHistory.unshift(q);
      box.insertAdjacentHTML('beforeend', msgHtml({ role: 'user', text: q }) + `<div class="typing" role="status"><i></i><i></i><i></i><span>Analyse des données…</span></div>`); box.scrollTop = box.scrollHeight;
      let res; try { res = await answer(q); await new Promise((r) => setTimeout(r, 450)); APP.chat.push({ role: 'bot', ...res }); }
      catch (e) { APP.chat.push({ role: 'bot', err: true, html: `<p><strong>Je n’ai pas pu accéder aux données.</strong> ${esc(e.message)} Je ne répondrai pas sans données vérifiables.</p>`, src: [e.path] }); }

    };
    el.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); const t = el.querySelector('textarea'); const v = t.value; t.value = ''; send(v); });
    el.querySelector('textarea').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.querySelector('form').requestSubmit(); } });
    el.querySelectorAll('[data-suggest]').forEach((b) => b.addEventListener('click', () => send(b.dataset.suggest)));
  }
  function msgHtml(m) {
    if (m.role === 'user') return `<div class="msg msg--user">${esc(m.text)}</div>`;
    return `<div class="msg msg--bot${m.err ? ' msg--err' : ''}"><div class="msg__body">${m.html}${m.actions ? `<div class="row" style="margin-top:8px">${m.actions.map(([l, h]) => `<a class="btn btn--sm" href="${h}">${l}${icon('arrowRight')}</a>`).join('')}</div>` : ''}</div>${m.src?.length ? `<div class="msg__src">Sources : ${m.src.map((s) => `<code>GET ${esc(s)}</code>`).join('')}</div>` : m.err ? '' : `<div class="msg__src">Source : référentiel méthodologique FireWatch</div>`}</div>`;
  }
  function rerenderAssistants() { const panel = document.getElementById('assistant-panel'); if (panel.classList.contains('is-open')) renderAssistant(panel, false); const pg = document.getElementById('assistant-page'); if (pg) renderAssistant(pg, true); const h = document.getElementById('chat-history'); if (h) h.innerHTML = historyHtml(); }
  const historyHtml = () => (APP.chatHistory.length ? APP.chatHistory.map((q, i) => `<button ${i === 0 ? 'aria-current="true"' : ''}>${esc(q)}<small>Aujourd’hui</small></button>`).join('') : '<p class="small muted" style="padding:8px 10px">Aucune conversation pour le moment.</p>');
  APP.renderAssistant = renderAssistant; APP.historyHtml = historyHtml;
  function openAssistant(open) {

    if (open) { renderAssistant(p, false); setTimeout(() => p.querySelector('textarea')?.focus(), 230); }
  }
  APP.openAssistant = openAssistant;

  // ---------- démarrage ----------
  function boot() {
    document.body.innerHTML = shell(); APP.applySettings();
    API.onCall((e) => { const el = document.getElementById('api-last'); if (el) el.textContent = `GET ${e.url.length > 70 ? e.url.slice(0, 70) + '…' : e.url} → ${e.status}`; });
    document.getElementById('range').value = APP.filters.range;
    document.getElementById('range').addEventListener('change', (e) => { if (e.target.value === 'custom') { APP.filters.range = 'custom'; APP.filters.start = APP.filters.start || '2026-10-01'; APP.filters.end = APP.filters.end || '2026-11-14'; APP.go('#historique'); } else APP.filters.range = e.target.value; navigate(); loadMeta(); });
    document.getElementById('sim-state').addEventListener('change', (e) => { API.state = e.target.value; loadMeta(); navigate(); });
    document.getElementById('sim-route').addEventListener('change', (e) => APP.go('#' + e.target.value));
    document.querySelectorAll('.fw-stage__bar [data-frame]').forEach((b) => b.addEventListener('click', () => setFrame(b.dataset.frame)));
    document.addEventListener('click', (e) => {
      if (e.target.closest('.skip-link')) { e.preventDefault(); document.getElementById('main').focus(); return; }
      const a = e.target.closest('[data-action]'); if (!a) return; const act = a.dataset.action;
      if (act === 'nav') { document.getElementById('app').classList.contains('nav-open') ? closeNav() : openNav(); }
      if (act === 'assistant') openAssistant(true);
      if (act === 'assistant-close') openAssistant(false);
      if (act === 'retry') { if (API.state === 'error' || API.state === 'offline') { U.toast('Nouvelle tentative…', 'Le service répond toujours en erreur (état simulé). Passez l’état sur « Normal » pour revenir aux données.', 'warn'); } navigate(); }
    });
    document.getElementById('scrim').addEventListener('click', () => { closeNav(); openAssistant(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeNav(); openAssistant(false); } });
    window.addEventListener('hashchange', navigate);
    loadMeta(); navigate();
  }
  APP.syncRange = () => { const r = document.getElementById('range'); if (r) r.value = APP.filters.range; };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
